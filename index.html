<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>GDO Reparto — Granja del Oeste</title>
  <meta name="theme-color" content="#F58220"/>
  <link rel="icon" type="image/svg+xml" href="assets/isotipo-color.svg"/>
  <link rel="manifest" href="manifest.webmanifest"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="GDO Reparto"/>
  <link rel="apple-touch-icon" href="assets/icon-app.svg"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Zilla+Slab:wght@500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="css/styles.css"/>
</head>
<body>
  <div id="app"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/data.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/route.js"></script>
  <script src="js/geo.js"></script>
  <script src="js/extras.js"></script>
  <script src="js/views/login.js"></script>
  <script src="js/views/admin.js"></script>
  <script src="js/views/rutas.js"></script>
  <script src="js/views/repartidor.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
      // Cuando se activa una versión nueva, recargar UNA vez para que el celular
      // nunca quede pegado a una versión vieja en caché.
      var _gdoReloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (_gdoReloaded) return; _gdoReloaded = true; window.location.reload();
      });
    }
  </script>
</body>
</html>
