<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba del motor CRM</title>
<style>body{font-family:system-ui;padding:20px;max-width:1000px;margin:0 auto}
pre{background:#f3f4f6;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:13px}
h2{border-bottom:2px solid #F58220;padding-bottom:4px}
.ok{color:#1d7a44;font-weight:700}.bad{color:#b32020;font-weight:700}</style></head>
<body>
<h1>Prueba del motor CRM (js/crm.js)</h1>
<div id="out">cargando…</div>
<script src="js/ui.js"></script>
<script src="js/crm.js"></script>
<script src="js/descuentos.js"></script>
<script>
const DIA = 86400000;
const hoy = Date.now();
let n = 0;
// hace: días atrás. items: [[producto, cantidad, precio]]
function ped(cliente, tel, hace, items, estado) {
  const ts = hoy - hace * DIA;
  return {
    id: 'p_' + (++n), cliente: cliente, telefono: tel,
    direccion: 'Calle ' + n + ', Hurlingham', localidad: 'Hurlingham',
    estado: estado || 'entregado',
    items: items.map((i) => ({ producto: i[0], cantidad: i[1], precio: i[2] })),
    historia: (estado && estado !== 'entregado') ? [] : [{ ts: ts, est: 'entregado' }],
    fechaEntrega: new Date(ts).toISOString().slice(0, 10),
  };
}
const POLLO = ['Pollo entero', 10, 3000];
const MILA = ['Milanesa de pollo', 5, 6000];
const HAMB = ['Hamburguesa', 4, 4000];
const HUEVO = ['Huevos', 2, 5000];

const PEDIDOS = [
  // A · DORMIDO: compraba cada 9 días, hace 26 que no pide
  ped('Kiosco Don José', '11 5555-1111', 71, [POLLO, MILA]),
  ped('kiosco don jose', '1155551111', 62, [POLLO, MILA]),          // mismo tel, otra escritura
  ped('Don Jose (V. Tesei)', '+54 9 11 5555-1111', 53, [POLLO, MILA]),
  ped('Kiosco Don José', '11 5555-1111', 44, [POLLO, MILA]),
  ped('Kiosco Don José', '11 5555-1111', 35, [POLLO, MILA]),
  ped('Kiosco Don José', '11 5555-1111', 26, [POLLO, MILA]),

  // B · LE TOCA: cada 7 días, último hace 10
  ped('Granja 2 Cuñados', '11 5555-2222', 38, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 31, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 24, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 17, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 10, [POLLO, HUEVO]),

  // C · COMPRÓ UNA SOLA VEZ hace 20 días
  ped('Carnicería La Estrella', '11 5555-3333', 20, [MILA]),

  // D · DEJÓ DE LLEVAR milanesa + BAJÓ el volumen
  ped('Almacén Rosa', '11 5555-4444', 42, [POLLO, MILA, HAMB]),
  ped('Almacén Rosa', '11 5555-4444', 34, [POLLO, MILA, HAMB]),
  ped('Almacén Rosa', '11 5555-4444', 26, [POLLO, MILA, HAMB]),
  ped('Almacén Rosa', '11 5555-4444', 18, [['Pollo entero', 3, 3000]]),
  ped('Almacén Rosa', '11 5555-4444', 9, [['Pollo entero', 2, 3000]]),

  // E · YA TIENE PEDIDO EN CURSO: no debe aparecer en la agenda
  ped('Fiambrería El Rey', '11 5555-5555', 30, [POLLO]),
  ped('Fiambrería El Rey', '11 5555-5555', 20, [POLLO]),
  ped('Fiambrería El Rey', '11 5555-5555', 10, [POLLO]),
  ped('Fiambrería El Rey', '11 5555-5555', -1, [POLLO], 'pendiente'),

  // F · NO ENTREGADO: no cuenta como compra
  ped('Rotisería Norte', '11 5555-6666', 5, [POLLO], 'no_entregado'),
];

// ── Casos de UNIFICACIÓN (teléfono / dirección / nombre) ──
function pedDir(cliente, tel, dir, hace, items, estado) {
  const p = ped(cliente, tel, hace, items, estado); p.direccion = dir; return p;
}
// G · El MISMO cliente: a veces con teléfono, a veces sin. Debe quedar UNA ficha.
PEDIDOS.push(pedDir('Panadería San Cayetano', '11 5555-7777', 'Av. Vergara 1500, Hurlingham', 40, [POLLO]));
PEDIDOS.push(pedDir('Panaderia San Cayetano', '', 'Av. Vergara 1500, Hurlingham', 30, [POLLO]));
// H · Misma dirección, nombre distinto, SIN teléfono: se une por la dirección.
PEDIDOS.push(pedDir('San Cayetano (el de Vergara)', '', 'Vergara 1500', 20, [POLLO]));
// I · MISMA DIRECCIÓN pero TELÉFONO DISTINTO: son dos vecinos. NO se deben unir.
PEDIDOS.push(pedDir('Depto 4B - Marcela', '11 5555-8888', 'Av. Vergara 1500, Hurlingham', 15, [HUEVO]));
// J · Mismo cliente que se mudó y cambió de número: la app NO puede saberlo sola,
//     se une a mano con GDO.CRM.unir().
PEDIDOS.push(pedDir('Pollería del Centro', '11 5555-9001', 'Roca 220, Morón', 60, [POLLO]));
PEDIDOS.push(pedDir('Polleria del Centro (nueva)', '11 5555-9002', 'Mitre 45, Morón', 12, [POLLO]));

GDO.Store = {
  pedidos: () => PEDIDOS,
  crmClientes: () => [],
  current: () => ({ nombre: 'Matías Lemos' }),
  upsertCrmCliente: (x) => x,
};

const L = [];
const chk = (cond, txt) => L.push('<div class="' + (cond ? 'ok">✓ ' : 'bad">✗ ') + txt + '</div>');

const fichas = GDO.CRM.fichas();
const sugs = GDO.CRM.agenda(fichas);
const de = (nom) => fichas.filter((f) => f.nombre.indexOf(nom) >= 0 || GDO.CRM.norm(f.nombre).indexOf(GDO.CRM.norm(nom)) >= 0)[0];
const todas = GDO.CRM.sugerencias(fichas);
const sugDe = (nom, tipo) => todas.filter((s) => GDO.CRM.norm(s.ficha.nombre).indexOf(GDO.CRM.norm(nom)) >= 0 && (!tipo || s.tipo === tipo))[0];

L.push('<h2>1 · Agrupación de clientes</h2>');
chk(fichas.length === 10, 'Salieron 10 fichas de ' + PEDIDOS.length + ' pedidos (dio ' + fichas.length + ')');
const A = de('Don Jos');
chk(!!A && A.nCompras === 6, 'Las 3 escrituras de "Kiosco Don José" quedaron en UNA ficha con 6 compras (dio ' + (A ? A.nCompras : '—') + ')');
const F = de('Roter');
chk(!F || F.nCompras === 0, 'El pedido "no entregado" no cuenta como compra');

L.push('<h2>2 · Ritmo de compra</h2>');
chk(A && A.ritmo === 9, 'Don José: ritmo de 9 días (dio ' + (A ? A.ritmo : '—') + ')');
chk(A && A.diasDesde === 26, 'Don José: última compra hace 26 días (dio ' + (A ? A.diasDesde : '—') + ')');
const B = de('Cuñados');
chk(B && B.ritmo === 7, 'Granja 2 Cuñados: ritmo de 7 días (dio ' + (B ? B.ritmo : '—') + ')');

L.push('<h2>3 · Productos habituales</h2>');
chk(A && A.habituales.length === 2, 'Don José: 2 productos habituales (dio ' + (A ? A.habituales.map((x) => x.nombre).join(', ') : '—') + ')');

L.push('<h2>4 · Sugerencias detectadas</h2>');
chk(!!sugDe('Don Jos', 'dormido'), 'Don José aparece como CLIENTE DORMIDO');
chk(!!sugDe('Cuñados', 'toca'), 'Granja 2 Cuñados aparece como LE TOCA PEDIDO');
chk(!!sugDe('Estrella', 'sin_segunda'), 'La Estrella aparece como COMPRÓ UNA SOLA VEZ');
chk(!!sugDe('Rosa', 'dejo'), 'Almacén Rosa aparece como DEJÓ DE LLEVAR');
chk(!!sugDe('Rosa', 'bajo'), 'Almacén Rosa aparece como BAJÓ EL VOLUMEN');
chk(!sugDe('Fiambrer'), 'Fiambrería El Rey NO aparece (ya tiene un pedido en curso)');

L.push('<h2>4b · Unificar por teléfono, dirección o nombre</h2>');
const pan = fichas.filter((f) => GDO.CRM.norm(f.nombre).indexOf('cayetano') >= 0);
chk(pan.length === 1, 'Panadería San Cayetano: UNA sola ficha aunque 2 pedidos no traían teléfono (dio ' + pan.length + ')');
chk(pan[0] && pan[0].nCompras === 3, 'Junta los 3 pedidos: con teléfono, sin teléfono y con la dirección abreviada (dio ' + (pan[0] ? pan[0].nCompras : '—') + ')');
chk(pan[0] && pan[0].alias.length === 3, 'La ficha guarda las 3 formas en que se escribió el nombre (dio ' + (pan[0] ? pan[0].alias.length : '—') + ')');
const marcela = fichas.filter((f) => f.nombre.indexOf('Marcela') >= 0)[0];
chk(!!marcela && marcela.nCompras === 1, 'El vecino de la MISMA dirección con OTRO teléfono queda aparte (no se mezcla)');
chk(GDO.CRM.dirKey('Av. Pres. Juan D. Perón 6871, Villa Udaondo, Ituzaingó') === GDO.CRM.dirKey('Pres Juan Peron 6871'), 'La dirección se compara sin "Av.", sin iniciales sueltas y sin localidad');
chk(GDO.CRM.dirKey('Calle 13, Hurlingham') === '', 'Una dirección sin nombre de calle real no sirve para unificar');
chk(GDO.CRM.nomKey('Consumidor Final') === '', 'Nombres genéricos ("Consumidor Final") no unifican a nadie');

L.push('<h2>4c · Unir a mano dos fichas</h2>');
const pc = fichas.filter((f) => GDO.CRM.norm(f.nombre).indexOf('centro') >= 0);
chk(pc.length === 2, 'El cliente que se mudó Y cambió de número queda en 2 fichas: la app no puede saberlo sola (dio ' + pc.length + ')');
var DOCS = [], seq = 0;
GDO.Store.crmClientes = function () { return DOCS; };
GDO.Store.upsertCrmCliente = function (c) {
  var ex = c.id ? DOCS.filter(function (x) { return x.id === c.id; })[0] : null;
  if (ex) { Object.assign(ex, c); return ex; }
  c.id = c.id || ('cli_' + (++seq)); DOCS.push(c); return c;
};
GDO.Store.deleteCrmCliente = function (id) { DOCS = DOCS.filter(function (x) { return x.id !== id; }); };
if (pc.length === 2) GDO.CRM.unir(pc[0], pc[1]);
const pc2 = GDO.CRM.fichas().filter((f) => GDO.CRM.norm(f.nombre).indexOf('centro') >= 0);
chk(pc2.length === 1, 'Después de unir a mano: una sola ficha (dio ' + pc2.length + ')');
chk(pc2[0] && pc2[0].nCompras === 2, 'La ficha unida junta los 2 pedidos, con teléfonos y direcciones distintos (dio ' + (pc2[0] ? pc2[0].nCompras : '—') + ')');
chk(pc2[0] && pc2[0].telefonos.length === 2, 'Guarda los 2 teléfonos del cliente (dio ' + (pc2[0] ? pc2[0].telefonos.length : '—') + ')');
chk(DOCS.length === 1, 'La unión deja UN solo documento guardado, no dos (dio ' + DOCS.length + ')');

L.push('<h2>4d · Pedidos sin fecha (los viejos)</h2>');
// Pedido viejo marcado entregado, sin fecha de entrega ni registro de cuándo: la app no sabe cuándo fue.
const viejo = { id: 'p_viejo', cliente: 'Verdulería Los Pinos', telefono: '11 5555-9500',
  direccion: 'Roca 900, Morón', estado: 'entregado', items: [{ producto: 'Pollo entero', cantidad: 4 }],
  historia: [], fechaEntrega: '' };
PEDIDOS.push(viejo);
chk(GDO.CRM.fechaDe(viejo) === null, 'Un pedido viejo sin fecha de entrega ni entrega registrada no tiene fecha');
chk(GDO.CRM.sinFecha().length === 1, 'La app los detecta y los puede listar para completarlos (dio ' + GDO.CRM.sinFecha().length + ')');
const fv = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Los Pinos') >= 0)[0];
chk(!!fv, 'El cliente igual aparece en la lista de clientes (no se pierde)');
chk(fv && fv.nCompras === 0, 'Pero no cuenta como compra: sin fecha no hay ritmo posible (dio ' + (fv ? fv.nCompras : '—') + ')');
// Con fecha de alta (pedidos nuevos, desde ago-2026) sí se ubica en el tiempo.
viejo.creado = hoy - 5 * DIA;
chk(GDO.CRM.fechaDe(viejo) === viejo.creado, 'Los pedidos nuevos guardan fecha de alta y ya no quedan sin fecha');
chk(GDO.CRM.sinFecha().length === 0, 'Con la fecha de alta, no queda ningún pedido huérfano');
PEDIDOS.pop();

L.push('<h2>4f · Clientes que volvieron pero quedaron partidos</h2>');
// K · Mismo cliente, misma puerta, dos telefonos (celular y fijo). Se une SOLO.
PEDIDOS.push(pedDir('Rotiseria El Nono', '11 5533-0001', 'Belgrano 450, Hurlingham', 50, [POLLO]));
PEDIDOS.push(pedDir('Rotiseria El Nono', '11 5533-0002', 'Belgrano 450, Hurlingham', 25, [POLLO]));
const nono = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Nono') >= 0);
chk(nono.length === 1, 'Mismo nombre Y misma direccion con dos telefonos: se une sola (dio ' + nono.length + ' ficha)');
chk(nono[0] && nono[0].nCompras === 2, 'Y queda con las 2 compras, o sea aparece como cliente que repite (dio ' + (nono[0] ? nono[0].nCompras : '—') + ')');

// L · Mismo nombre, DIRECCION distinta, telefono distinto: NO se une sola,
//     pero la app lo propone como posible duplicado.
PEDIDOS.push(pedDir('Flavia Marisa Gomez', '11 5533-1001', 'Roca 100, Moron', 40, [MILA]));
PEDIDOS.push(pedDir('Flavia Marisa Gomez', '11 5533-1002', 'Sarmiento 700, Moron', 15, [MILA]));
const flavias = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Flavia') >= 0);
chk(flavias.length === 2, 'Mismo nombre pero otra direccion y otro telefono: NO se une sola (dio ' + flavias.length + ')');
const dups = GDO.CRM.posiblesDuplicados();
const parFlavia = dups.filter((d) => d.a.nombre.indexOf('Flavia') >= 0 && d.b.nombre.indexOf('Flavia') >= 0)[0];
chk(!!parFlavia, 'Pero la app lo detecta y lo propone para unir en un toque');
chk(parFlavia && parFlavia.motivo.indexOf('telefonos distintos') >= 0 || (parFlavia && parFlavia.motivo.length > 0), 'Y explica por que sospecha: ' + (parFlavia ? parFlavia.motivo : '—'));
// M · Nombre PARECIDO pero no igual, sin nada mas en comun: NO se debe proponer.
PEDIDOS.push(pedDir('Melanie', '11 5533-2001', 'Mitre 55, Ituzaingo', 44, [POLLO]));
PEDIDOS.push(pedDir('Melanie Rodriguez', '11 5533-2002', 'Alvear 900, Ituzaingo', 10, [POLLO]));
const dups2 = GDO.CRM.posiblesDuplicados();
chk(!dups2.some((d) => (d.a.nombre === 'Melanie' && d.b.nombre === 'Melanie Rodriguez') || (d.b.nombre === 'Melanie' && d.a.nombre === 'Melanie Rodriguez')),
  '"Melanie" y "Melanie Rodriguez" NO se proponen: el nombre no coincide completo ni comparten direccion');
chk(!dups2.some((d) => GDO.CRM.norm(d.a.nombre).indexOf('rosa') >= 0 && GDO.CRM.norm(d.b.nombre).indexOf('cuñados') >= 0),
  'No propone unir clientes que no tienen nada que ver');
chk(dups2.every((d) => {
  const nomIgual = (d.a.alias || [d.a.nombre]).some((x) => (d.b.alias || [d.b.nombre]).some((y) => GDO.CRM.nomKey(x) && GDO.CRM.nomKey(x) === GDO.CRM.nomKey(y)));
  const dirIgual = (d.a.direcciones || []).some((x) => (d.b.direcciones || []).some((y) => GDO.CRM.dirKey(x) && GDO.CRM.dirKey(x) === GDO.CRM.dirKey(y)));
  return nomIgual || dirIgual;
}), 'Toda sugerencia tiene coincidencia EXACTA de nombre completo o de direccion');

// N · "Son distintos" queda guardado y no se vuelve a proponer.
var DOCS = [], seq = 0;
GDO.Store.crmClientes = function () { return DOCS; };
GDO.Store.upsertCrmCliente = function (c) {
  var ex = c.id ? DOCS.filter(function (x) { return x.id === c.id; })[0] : null;
  if (ex) { Object.assign(ex, c); return ex; }
  c.id = c.id || ('cli_' + (++seq)); DOCS.push(c); return c;
};
GDO.Store.deleteCrmCliente = function (id) { DOCS = DOCS.filter(function (x) { return x.id !== id; }); };
const parF = GDO.CRM.posiblesDuplicados().filter((d) => d.a.nombre.indexOf('Flavia') >= 0)[0];
chk(!!parF, 'Las dos "Flavia Marisa Gomez" se proponen (nombre completo identico)');
GDO.CRM.rechazarUnion(parF.a, parF.b);
chk(!GDO.CRM.posiblesDuplicados().some((d) => d.a.nombre.indexOf('Flavia') >= 0 && d.b.nombre.indexOf('Flavia') >= 0),
  'Tras marcar "son distintos", NO se vuelve a proponer ese par');

L.push('<h2>4g · Registro de contactos</h2>');
GDO.Store.current = function () { return { id: 'u9', nombre: 'Gonzalo Vendedor' }; };
let fc = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Kiosco Don') >= 0)[0];
GDO.CRM.registrarContacto(fc, { canal: 'llamada', resultado: 'pide', nota: 'Esta con stock hasta el jueves, lo llamo despues.', proximo: new Date(hoy + 4 * DIA).toISOString().slice(0, 10), motivoProximo: 'pasarle precio de milanesa' }, 'dormido');
fc = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Kiosco Don') >= 0)[0];
chk(fc.contactos.length === 1, 'El contacto queda guardado en la ficha');
chk(fc.contactos[0].porNombre === 'Gonzalo Vendedor', 'Queda registrado QUIEN lo contacto (dio ' + fc.contactos[0].porNombre + ')');
chk(fc.contactos[0].canal === 'llamada' && fc.contactos[0].resultado === 'pide', 'Queda el canal y en que quedaron');
chk(fc.contactos[0].nota.indexOf('jueves') >= 0, 'Queda lo que dijo el cliente');
chk(fc.recordatorio && fc.recordatorio.motivo.indexOf('milanesa') >= 0, '"Volver a contactarlo" se convierte en recordatorio con su motivo');
chk(!GDO.CRM.agenda().some((s) => s.clienteId === fc.id), 'Y mientras tanto sale de la lista de hoy (no se repite el llamado)');
// "Ya no nos compra" apaga los avisos.
let fx = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Cuñados') >= 0)[0];
GDO.CRM.registrarContacto(fx, { canal: 'whatsapp', resultado: 'nocompra', nota: 'Cerro el local.' }, 'toca');
fx = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Cuñados') >= 0)[0];
chk(fx.pausado === true, '"Ya no nos compra" apaga los avisos de ese cliente');
chk(!GDO.CRM.agenda().some((s) => s.clienteId === fx.id), 'Y deja de aparecer en la agenda');
DOCS = []; seq = 0;
GDO.Store.crmClientes = function () { return []; };
GDO.Store.upsertCrmCliente = function (c) { return c; };
GDO.Store.current = function () { return { nombre: 'Matías Lemos' }; };
for (let k = 0; k < 6; k++) PEDIDOS.pop();

L.push('<h2>4e · La agenda no se inunda de primeras compras</h2>');
// Escenario real de GDO (ago-2026): 78 pedidos, casi todos de clientes que
// compraron UNA sola vez. Antes eso daba "50 clientes para contactar, 42 urgentes".
for (let k = 0; k < 40; k++) PEDIDOS.push(ped('Cliente Suelto ' + k, '11 5544-' + (1000 + k), 30 + k, [POLLO]));
const part = GDO.CRM.agendaPartida();
chk(part.hoy.length <= 10 || true, 'Hoy: ' + part.hoy.length + ' · Para cuando tengas un rato: ' + part.luego.length);
chk(part.hoy.every((s) => s.ficha.nCompras >= 2 || s.tipo === 'primera'), 'En "Hoy" solo entran clientes que ya venían comprando (2 compras o más) y el "cómo le fue" de la primera compra');
chk(part.luego.filter((s) => s.tipo === 'sin_segunda').length >= 40 && !part.hoy.some((s) => s.tipo === 'sin_segunda'),
  'Todas las primeras compras sin repetir van al segundo grupo, ninguna a "Hoy" (dio ' + part.luego.filter((s) => s.tipo === 'sin_segunda').length + ' en el segundo grupo)');
chk(part.hoy.length < 10, 'La lista de hoy queda corta y hacible (dio ' + part.hoy.length + ')');
// Orden por plata: a igual urgencia, primero el que más deja.
const tocaHoy = part.hoy.filter((s) => s.prio === 78).map((s) => s.ficha.total);
chk(tocaHoy.every((v, i) => i === 0 || tocaHoy[i - 1] >= v), 'A igual urgencia, primero el cliente que más plata deja');
for (let k = 0; k < 40; k++) PEDIDOS.pop();

L.push('<h2>4h · Primera compra: a los 2 días, preguntar cómo le fue</h2>');
// N · Recibió su primer pedido hace 3 días → hay que preguntarle.
PEDIDOS.push(ped('Verdulería Nueva', '11 5522-0001', 3, [MILA]));
// O · Lo recibió AYER → todavía no (no llegó a probarlo).
PEDIDOS.push(ped('Almacén Recién', '11 5522-0002', 1, [POLLO]));
// P · Su primer pedido todavía no se entregó.
PEDIDOS.push(ped('Kiosco En Camino', '11 5522-0003', -1, [POLLO], 'pendiente'));
// Q · Primer pedido RETIRADO en el local hace 2 días.
const pq = ped('Rotisería Retira', '11 5522-0004', 2, [HAMB]); pq.modalidad = 'retiro'; PEDIDOS.push(pq);
const fsN = GDO.CRM.fichas();
const nd = (nom) => fsN.filter((f) => f.nombre.indexOf(nom) >= 0)[0];
const sP = GDO.CRM.sugerencias(fsN);
const sN = sP.filter((s) => s.tipo === 'primera' && s.ficha.nombre.indexOf('Verdulería Nueva') >= 0)[0];
chk(!!sN, 'Recibió su primer pedido hace 3 días: aparece "preguntale cómo le fue"');
chk(sN && sN.grupo === 'hoy', 'Y va a la lista de HOY (es el momento justo, no una tanda para después)');
chk(sN && /primer pedido/.test(sN.msg) && /qué tal te fue/.test(sN.msg) && !/\$/.test(sN.msg), 'El mensaje pregunta cómo le fue y no nombra precios');
chk(!sP.some((s) => s.tipo === 'primera' && s.ficha.nombre.indexOf('Recién') >= 0), 'Lo recibió ayer: todavía NO se le pregunta');
chk(GDO.CRM.seguimiento(nd('Recién')).estado === 'espera', 'Queda "en espera" (dio ' + GDO.CRM.seguimiento(nd('Recién')).estado + ')');
chk(!sP.some((s) => s.ficha.nombre.indexOf('En Camino') >= 0), 'Si el primer pedido no se entregó, no se le pregunta nada');
chk(GDO.CRM.seguimiento(nd('En Camino')).estado === 'curso', 'Figura como "primer pedido en curso" (dio ' + GDO.CRM.seguimiento(nd('En Camino')).estado + ')');
const sQ = sP.filter((s) => s.tipo === 'primera' && s.ficha.nombre.indexOf('Retira') >= 0)[0];
chk(sQ && /pasaste a retirar/.test(sQ.msg), 'Si lo retiró en el local, el mensaje dice "pasaste a retirar" (no "recibiste")');
const nv = GDO.CRM.primerasCompras(fsN);
chk(nv.length >= 4 && nv[0].seg.estado === 'toca', 'La pestaña de primeras compras los lista, primero los que hay que preguntar (' + nv.map((x) => x.seg.estado).join(', ') + ')');
chk(!nv.some((x) => x.ficha.nombre.indexOf('Kiosco Don') >= 0), 'Un cliente que compra hace meses no figura como nuevo');
chk(!nv.some((x) => x.ficha.nombre.indexOf('Cuñados') >= 0), 'Tampoco un cliente habitual cuya primera compra fue hace más de 30 días');

// Con la ficha guardada de verdad (contactos), el seguimiento avanza.
DOCS = []; seq = 0;
GDO.Store.crmClientes = function () { return DOCS; };
GDO.Store.upsertCrmCliente = function (c) {
  var ex = c.id ? DOCS.filter(function (x) { return x.id === c.id; })[0] : null;
  if (ex) { Object.assign(ex, c); return ex; }
  c.id = c.id || ('cli_' + (++seq)); DOCS.push(c); return c;
};
const fresca = (nom) => GDO.CRM.fichas().filter((f) => f.nombre.indexOf(nom) >= 0)[0];
GDO.CRM.marcarContactado(fresca('Verdulería Nueva'), 'primera', 'whatsapp');
chk(GDO.CRM.seguimiento(fresca('Verdulería Nueva')).estado === 'escrito', 'Después del WhatsApp queda "falta anotar qué contestó"');
chk(!GDO.CRM.agenda().some((s) => s.clienteId === fresca('Verdulería Nueva').id), 'Y sale de la lista de hoy');
GDO.CRM.registrarContacto(fresca('Verdulería Nueva'), { canal: 'whatsapp', resultado: 'problema', tema: 'entrega', nota: 'Le gustó la milanesa pero el pedido llegó tarde.' }, 'primera');
const sg = GDO.CRM.seguimiento(fresca('Verdulería Nueva'));
chk(sg.estado === 'critica', 'Con la respuesta anotada queda como CRÍTICA (dio ' + sg.estado + ')');
chk(sg.opinion && sg.opinion.tema === 'entrega' && sg.opinion.nota.indexOf('tarde') >= 0, 'La crítica guarda su tema (entrega) y lo que dijo el cliente');
GDO.CRM.registrarContacto(fresca('Rotisería Retira'), { canal: 'local', resultado: 'gusto', nota: 'Muy rica la hamburguesa.' }, 'primera');
chk(GDO.CRM.seguimiento(fresca('Rotisería Retira')).estado === 'gusto', 'El que dijo que le gustó queda como "le gustó"');
chk(fresca('Rotisería Retira').contactos[0].tema === '', 'Una opinión buena no lleva tema de crítica');
// Si ya se le preguntó, el aviso de "compró una sola vez" (día 12+) no le vuelve a preguntar cómo le fue.
GDO.CRM.registrarContacto(fresca('Estrella'), { canal: 'llamada', resultado: 'gusto' }, 'primera');
GDO.CRM.guardar(fresca('Estrella'), { snooze: {} });
const sE = GDO.CRM.sugerencias().filter((s) => s.tipo === 'sin_segunda' && s.ficha.nombre.indexOf('Estrella') >= 0)[0];
chk(sE && !/qué tal te fue/.test(sE.msg), 'Si ya se le preguntó cómo le fue, el mensaje de "compró una sola vez" no se lo vuelve a preguntar');
L.push('<b>primera → Verdulería Nueva</b><pre>' + (sN ? sN.msg : '—') + '</pre>');
L.push('<b>primera (retiro) → Rotisería Retira</b><pre>' + (sQ ? sQ.msg : '—') + '</pre>');
DOCS = []; seq = 0;
GDO.Store.crmClientes = function () { return []; };
GDO.Store.upsertCrmCliente = function (c) { return c; };
for (let k = 0; k < 4; k++) PEDIDOS.pop();

L.push('<h2>4i · La venta cuenta recién cuando se ENTREGA</h2>');
// R · Pedido pendiente con la fecha de entrega YA pasada, que nadie marcó entregado.
const pr = ped('Pizzería Sin Entregar', '11 5511-0001', 4, [POLLO], 'pendiente');
PEDIDOS.push(pr);
const fPr = () => GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Sin Entregar') >= 0)[0];
chk(fPr() && fPr().nCompras === 0, 'Un pedido pendiente con la fecha ya pasada NO cuenta como venta (dio ' + (fPr() ? fPr().nCompras : '—') + ')');
chk(fPr() && fPr().enCurso.length === 1, 'Figura aparte, como pedido en curso');
chk(!GDO.CRM.sinFecha().some((p) => p.id === pr.id), 'Y no se lo trata como "pedido sin fecha": todavía no es una venta');
// Se entrega (hace un rato) → cuenta, con la fecha de la ENTREGA, no la pactada.
pr.estado = 'entregado'; pr.historia = [{ ts: hoy - 3000, est: 'entregado' }];
chk(fPr().nCompras === 1 && fPr().diasDesde === 0, 'Al marcarlo entregado cuenta, con la fecha de la entrega (hoy) y no la pactada (hace 4 días)');
// El chofer corrige la entrega → vuelve a en_ruta y deja de contar.
pr.estado = 'en_ruta'; pr.historia.push({ ts: hoy - 2000, est: 'reabierto' });
chk(fPr().nCompras === 0, 'Si el chofer corrige la entrega, deja de contar solo');
// Retiro en el local: el mostrador lo marca retirado (queda 'entregado') y cuenta.
pr.estado = 'entregado'; pr.modalidad = 'retiro'; pr.historia.push({ ts: hoy - 1000, est: 'entregado' });
chk(fPr().nCompras === 1 && fPr().nRetiros === 1, 'Un retiro marcado como retirado en el mostrador también cuenta como venta');
// Entregado con fecha pactada futura y sin registro de entrega: cuenta como de hoy, no del futuro.
const pf = ped('Bar Adelantado', '11 5511-0002', -3, [POLLO], 'pendiente'); pf.estado = 'entregado';
PEDIDOS.push(pf);
const fPf = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Adelantado') >= 0)[0];
chk(fPf && fPf.nCompras === 1 && fPf.diasDesde === 0, 'Entregado antes de la fecha pactada: cuenta, fechado hoy (nunca en el futuro)');
PEDIDOS.pop(); PEDIDOS.pop();

L.push('<h2>5 · Agrupación: una tarjeta por cliente</h2>');
const ids = sugs.map((s) => s.clienteId);
chk(ids.length === new Set(ids).size, 'Ningún cliente aparece dos veces en la agenda (' + sugs.length + ' tarjetas para ' + todas.length + ' avisos)');
const rosa = sugs.filter((s) => s.ficha.nombre.indexOf('Rosa') >= 0)[0];
chk(rosa && rosa.otras.length === 2, 'Almacén Rosa: 1 tarjeta con 2 motivos extra (dio ' + (rosa ? rosa.otras.length : '—') + ')');

L.push('<h2>6 · Orden por urgencia</h2>');
L.push('<pre>' + sugs.map((s, i) => (i + 1) + '. [' + s.prio + '] ' + s.ic + ' ' + s.ficha.nombre + ' — ' + s.titulo
  + '\n     ' + s.motivo
  + (s.otras.length ? '\n     También: ' + s.otras.map((o) => o.titulo).join(' · ') : '')
  + (s.oferta ? '\n     Ofrecele: ' + s.oferta : '')).join('\n') + '</pre>');

L.push('<h2>7 · Mensajes de WhatsApp generados</h2>');
['dormido', 'toca', 'sin_segunda', 'dejo'].forEach((t) => {
  const s = todas.filter((x) => x.tipo === t)[0];
  if (s) L.push('<b>' + t + ' → ' + s.ficha.nombre + '</b><pre>' + s.msg + '</pre>');
});
chk(!todas.some((s) => /\$/.test(s.msg)), 'Ningún mensaje inventa un precio (regla GDO)');
chk(todas.every((s) => !/Hola (Kiosco|Granja|Carnicería|Almacén|Fiambrería|San|Panadería|Pollería|Depto)!/.test(s.msg)), 'El saludo usa el nombre completo del comercio, no la primera palabra');
chk(todas.every((s) => s.msg.indexOf('(el de Vergara)') < 0), 'El saludo saca las aclaraciones entre paréntesis del nombre');
const idsF = fichas.map((f) => f.id);
chk(idsF.length === new Set(idsF).size, 'Cada ficha tiene un identificador único (dos vecinos de la misma dirección no se pisan)');

L.push('<h2>8 · Códigos de descuento (js/descuentos.js)</h2>');
var DESC = [];
GDO.Store.descuentos = function () { return DESC; };
GDO.Store.upsertDescuento = function (d) {
  var ex = DESC.filter(function (x) { return x.id === d.id; })[0];
  if (ex) { Object.assign(ex, d); return ex; }
  d.creado = Date.now(); DESC.push(d); return d;
};
const en = (n) => GDO.Desc.iso(new Date(Date.now() + n * DIA));
GDO.Desc.guardar({ codigo: 'volve 10', tipo: 'campana', pct: 10, nombre: 'Volvé', vence: en(10), soloEnvio: true });
chk(!!GDO.Desc.buscar('VOLVE10'), 'El código se guarda en mayúsculas y sin espacios ("volve 10" → VOLVE10)');
chk(GDO.Desc.validar('volve10', { telefono: '11 5000-0001', modalidad: 'envio' }).ok, 'Una campaña vigente vale para un cliente con envío (escrita en minúsculas también)');
chk(GDO.Desc.buscar('VOLVE10').soloMinorista === true && GDO.Desc.soloMin({ soloEnvio: true }), 'Los códigos "solo envío" de antes pasan a ser "solo venta minorista"');
chk(!GDO.Desc.validar('VOLVE10', { telefono: '11 5000-0001', lista: 'mayorista' }).ok, 'Un código "solo venta minorista" no vale en la lista mayorista');
chk(GDO.Desc.validar('VOLVE10', { telefono: '11 5000-0001', lista: 'minorista', modalidad: 'retiro' }).ok, 'Pero sí vale en la minorista, con envío o retirando en el local');
GDO.Desc.guardar({ codigo: 'TODOS5', tipo: 'campana', pct: 5, nombre: 'Para todos', soloMinorista: false });
chk(GDO.Desc.validar('TODOS5', { telefono: '11 5000-0001', lista: 'mayorista' }).ok, 'Un código sin "solo venta minorista" vale también en la mayorista');
chk(!GDO.Desc.validar('NOEXISTE', { telefono: '1150000001' }).ok, 'Un código que no existe se rechaza');
chk(!GDO.Desc.validar('VOLVE10', { telefono: '', modalidad: 'envio' }).ok, 'Sin teléfono no se aplica (cada cliente lo usa una vez)');
chk(GDO.Desc.aplicar(123456, { pct: 10 }).monto === 12346 && GDO.Desc.aplicar(123456, { pct: 10 }).total === 111110, 'El 10% se redondea al peso');
const pd = ped('Cliente Desc', '11 5000-0001', 2, [POLLO]); pd.creado = Date.now() - 2 * DIA;
pd.descuento = { codigo: 'VOLVE10', pct: 10, monto: 3000, subtotal: 30000 }; PEDIDOS.push(pd);
chk(!GDO.Desc.validar('VOLVE10', { telefono: '+54 9 11 5000-0001', modalidad: 'envio' }).ok, 'El mismo cliente no puede usar la campaña dos veces (aunque escriba el teléfono distinto)');
chk(GDO.Desc.validar('VOLVE10', { telefono: '1150000002', modalidad: 'envio' }).ok, 'Otro cliente sí la puede usar');
chk(GDO.Desc.validar('VOLVE10', { telefono: '1150000001', modalidad: 'envio', pedidoId: pd.id, creado: pd.creado, guardado: true }).ok, 'El pedido que ya lo tiene no choca consigo mismo');
const pd2 = ped('Cliente Desc', '11 5000-0001', 1, [POLLO]); pd2.creado = Date.now() - DIA;
pd2.descuento = { codigo: 'VOLVE10', pct: 10 }; PEDIDOS.push(pd2);
chk(!GDO.Desc.validar('VOLVE10', { telefono: '1150000001', modalidad: 'envio', pedidoId: pd2.id, creado: pd2.creado, guardado: true }).ok
  && GDO.Desc.validar('VOLVE10', { telefono: '1150000001', modalidad: 'envio', pedidoId: pd.id, creado: pd.creado, guardado: true }).ok,
  'Si lo usó en dos pedidos, vale el PRIMERO y el segundo queda marcado para revisar');
pd.estado = 'no_entregado'; pd2.estado = 'no_entregado';
chk(GDO.Desc.validar('VOLVE10', { telefono: '1150000001', modalidad: 'envio' }).ok, 'Un pedido "no entregado" no gasta el código');
PEDIDOS.pop(); PEDIDOS.pop();
GDO.Desc.guardar({ codigo: 'VIEJO5', tipo: 'campana', pct: 5, nombre: 'Viejo', vence: en(-1) });
chk(!GDO.Desc.validar('VIEJO5', { telefono: '1150000009' }).ok, 'Un código vencido no se puede aplicar hoy');
chk(GDO.Desc.validar('VIEJO5', { telefono: '1150000009', creado: Date.now() - 3 * DIA, guardado: true }).ok, 'Pero un pedido hecho ANTES del vencimiento conserva su descuento');
GDO.Desc.guardar(Object.assign({}, GDO.Desc.buscar('VOLVE10'), { activo: false }), GDO.Desc.buscar('VOLVE10'));
chk(!GDO.Desc.validar('VOLVE10', { telefono: '1150000003', modalidad: 'envio' }).ok, 'Un código pausado no se puede aplicar');
const cp = GDO.Desc.codigoPersonal('Juan Pérez');
chk(/^VOLVE-JUAN-[A-Z2-9]{3}$/.test(cp), 'El código personal lleva el nombre y 3 caracteres fáciles de dictar (' + cp + ')');
GDO.Desc.guardar({ codigo: cp, tipo: 'personal', pct: 10, vence: en(15), soloEnvio: true, clienteNombre: 'Juan Pérez', telefono: '11 4444-1234' });
chk(GDO.Desc.validar(cp, { telefono: '+54 9 11 4444-1234', modalidad: 'envio' }).ok, 'El código personal vale para su dueño');
chk(!GDO.Desc.validar(cp, { telefono: '11 4444-9999', modalidad: 'envio' }).ok, 'Y no vale con otro teléfono');
const pp = ped('Juan Pérez', '11 4444-1234', 1, [POLLO]); pp.creado = Date.now() - DIA; pp.descuento = { codigo: cp, pct: 10 }; PEDIDOS.push(pp);
chk(!GDO.Desc.validar(cp, { telefono: '1144441234', modalidad: 'envio' }).ok, 'Un código personal se usa una sola vez');
chk(GDO.Desc.estado(GDO.Desc.buscar(cp)) === 'usado', 'Y queda marcado como "ya se usó"');
PEDIDOS.pop();
GDO.Desc.guardar({ codigo: cp, tipo: 'personal', pct: 15, vence: en(15), soloEnvio: true }, GDO.Desc.buscar(cp));
chk(GDO.Desc.buscar(cp).tel8 === '44441234' && GDO.Desc.buscar(cp).pct === 15, 'Editar un código personal no le borra el dueño');
chk(GDO.Desc.colorDe(GDO.Desc.buscar(cp)) === 'negro' && GDO.Desc.colorDe(GDO.Desc.buscar('VIEJO5')) === 'naranja'
  && GDO.Desc.colorDe({ tipo: 'campana' }) === 'naranja' && GDO.Desc.colorDe({ tipo: 'personal' }) === 'negro',
  'Sin elegir color, la campaña sale naranja y el personal negro (como antes)');
GDO.Desc.guardar({ codigo: 'NEGRA20', tipo: 'campana', pct: 20, nombre: 'Black', color: 'negro' });
chk(GDO.Desc.buscar('NEGRA20').color === 'negro', 'Se puede elegir el voucher NEGRO para una campaña');
GDO.Desc.guardar({ codigo: 'NEGRA20', tipo: 'campana', pct: 25, nombre: 'Black' }, GDO.Desc.buscar('NEGRA20'));
chk(GDO.Desc.buscar('NEGRA20').color === 'negro' && GDO.Desc.buscar('NEGRA20').pct === 25, 'Editar el código sin tocar el color lo conserva');
GDO.Desc.guardar({ codigo: 'NARANJA-JUAN', tipo: 'personal', pct: 10, clienteNombre: 'Juan', telefono: '1144441111', color: 'naranja' });
chk(GDO.Desc.colorDe(GDO.Desc.buscar('NARANJA-JUAN')) === 'naranja', 'Y un personal puede ser NARANJA');
const msgV = GDO.Desc.mensajeVuelta({ nombre: 'Juan Pérez' }, GDO.Desc.buscar(cp));
chk(/^Hola Juan!/.test(msgV) && /hace tiempo que no sabemos nada de vos/i.test(msgV) && /15% de descuento/.test(msgV)
  && msgV.indexOf(cp) >= 0 && /próximo pedido minorista/.test(msgV) && !/domicilio/.test(msgV),
  'El mensaje saluda por el nombre y dice el %, "pedido minorista" (ya no "a domicilio") y el código');
L.push('<b>Mensaje "volvé" → Juan Pérez</b><pre>' + msgV + '</pre>');
L.push('<b>Mensaje de campaña</b><pre>' + GDO.Desc.mensajeCampana(Object.assign({}, GDO.Desc.buscar('VOLVE10'), { activo: true })) + '</pre>');

document.getElementById('out').innerHTML = L.join('');
</script>
</body></html>
