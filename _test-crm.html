<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Prueba del motor CRM</title>
<style>body{font-family:system-ui;padding:20px;max-width:1000px;margin:0 auto}
pre{background:#f3f4f6;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:13px}
h2{border-bottom:2px solid #F58220;padding-bottom:4px}
.ok{color:#1d7a44;font-weight:700}.bad{color:#b32020;font-weight:700}</style></head>
<body>
<h1>Prueba del motor CRM (js/crm.js)</h1>
<div id="out">cargando…</div>
<script src="js/ui.js"></script>
<script src="js/crm.js"></script>
<script>
const DIA = 86400000;
const hoy = Date.now();
let n = 0;
// hace: días atrás. items: [[producto, cantidad, precio]]
function ped(cliente, tel, hace, items, estado) {
  const ts = hoy - hace * DIA;
  return {
    id: 'p_' + (++n), cliente: cliente, telefono: tel,
    direccion: 'Calle ' + n + ', Hurlingham', localidad: 'Hurlingham',
    estado: estado || 'entregado',
    items: items.map((i) => ({ producto: i[0], cantidad: i[1], precio: i[2] })),
    historia: (estado && estado !== 'entregado') ? [] : [{ ts: ts, est: 'entregado' }],
    fechaEntrega: new Date(ts).toISOString().slice(0, 10),
  };
}
const POLLO = ['Pollo entero', 10, 3000];
const MILA = ['Milanesa de pollo', 5, 6000];
const HAMB = ['Hamburguesa', 4, 4000];
const HUEVO = ['Huevos', 2, 5000];

const PEDIDOS = [
  // A · DORMIDO: compraba cada 9 días, hace 26 que no pide
  ped('Kiosco Don José', '11 5555-1111', 71, [POLLO, MILA]),
  ped('kiosco don jose', '1155551111', 62, [POLLO, MILA]),          // mismo tel, otra escritura
  ped('Don Jose (V. Tesei)', '+54 9 11 5555-1111', 53, [POLLO, MILA]),
  ped('Kiosco Don José', '11 5555-1111', 44, [POLLO, MILA]),
  ped('Kiosco Don José', '11 5555-1111', 35, [POLLO, MILA]),
  ped('Kiosco Don José', '11 5555-1111', 26, [POLLO, MILA]),

  // B · LE TOCA: cada 7 días, último hace 10
  ped('Granja 2 Cuñados', '11 5555-2222', 38, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 31, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 24, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 17, [POLLO, HUEVO]),
  ped('Granja 2 Cuñados', '11 5555-2222', 10, [POLLO, HUEVO]),

  // C · COMPRÓ UNA SOLA VEZ hace 20 días
  ped('Carnicería La Estrella', '11 5555-3333', 20, [MILA]),

  // D · DEJÓ DE LLEVAR milanesa + BAJÓ el volumen
  ped('Almacén Rosa', '11 5555-4444', 42, [POLLO, MILA, HAMB]),
  ped('Almacén Rosa', '11 5555-4444', 34, [POLLO, MILA, HAMB]),
  ped('Almacén Rosa', '11 5555-4444', 26, [POLLO, MILA, HAMB]),
  ped('Almacén Rosa', '11 5555-4444', 18, [['Pollo entero', 3, 3000]]),
  ped('Almacén Rosa', '11 5555-4444', 9, [['Pollo entero', 2, 3000]]),

  // E · YA TIENE PEDIDO EN CURSO: no debe aparecer en la agenda
  ped('Fiambrería El Rey', '11 5555-5555', 30, [POLLO]),
  ped('Fiambrería El Rey', '11 5555-5555', 20, [POLLO]),
  ped('Fiambrería El Rey', '11 5555-5555', 10, [POLLO]),
  ped('Fiambrería El Rey', '11 5555-5555', -1, [POLLO], 'pendiente'),

  // F · NO ENTREGADO: no cuenta como compra
  ped('Rotisería Norte', '11 5555-6666', 5, [POLLO], 'no_entregado'),
];

// ── Casos de UNIFICACIÓN (teléfono / dirección / nombre) ──
function pedDir(cliente, tel, dir, hace, items, estado) {
  const p = ped(cliente, tel, hace, items, estado); p.direccion = dir; return p;
}
// G · El MISMO cliente: a veces con teléfono, a veces sin. Debe quedar UNA ficha.
PEDIDOS.push(pedDir('Panadería San Cayetano', '11 5555-7777', 'Av. Vergara 1500, Hurlingham', 40, [POLLO]));
PEDIDOS.push(pedDir('Panaderia San Cayetano', '', 'Av. Vergara 1500, Hurlingham', 30, [POLLO]));
// H · Misma dirección, nombre distinto, SIN teléfono: se une por la dirección.
PEDIDOS.push(pedDir('San Cayetano (el de Vergara)', '', 'Vergara 1500', 20, [POLLO]));
// I · MISMA DIRECCIÓN pero TELÉFONO DISTINTO: son dos vecinos. NO se deben unir.
PEDIDOS.push(pedDir('Depto 4B - Marcela', '11 5555-8888', 'Av. Vergara 1500, Hurlingham', 15, [HUEVO]));
// J · Mismo cliente que se mudó y cambió de número: la app NO puede saberlo sola,
//     se une a mano con GDO.CRM.unir().
PEDIDOS.push(pedDir('Pollería del Centro', '11 5555-9001', 'Roca 220, Morón', 60, [POLLO]));
PEDIDOS.push(pedDir('Polleria del Centro (nueva)', '11 5555-9002', 'Mitre 45, Morón', 12, [POLLO]));

GDO.Store = {
  pedidos: () => PEDIDOS,
  crmClientes: () => [],
  current: () => ({ nombre: 'Matías Lemos' }),
  upsertCrmCliente: (x) => x,
};

const L = [];
const chk = (cond, txt) => L.push('<div class="' + (cond ? 'ok">✓ ' : 'bad">✗ ') + txt + '</div>');

const fichas = GDO.CRM.fichas();
const sugs = GDO.CRM.agenda(fichas);
const de = (nom) => fichas.filter((f) => f.nombre.indexOf(nom) >= 0 || GDO.CRM.norm(f.nombre).indexOf(GDO.CRM.norm(nom)) >= 0)[0];
const todas = GDO.CRM.sugerencias(fichas);
const sugDe = (nom, tipo) => todas.filter((s) => GDO.CRM.norm(s.ficha.nombre).indexOf(GDO.CRM.norm(nom)) >= 0 && (!tipo || s.tipo === tipo))[0];

L.push('<h2>1 · Agrupación de clientes</h2>');
chk(fichas.length === 10, 'Salieron 10 fichas de ' + PEDIDOS.length + ' pedidos (dio ' + fichas.length + ')');
const A = de('Don Jos');
chk(!!A && A.nCompras === 6, 'Las 3 escrituras de "Kiosco Don José" quedaron en UNA ficha con 6 compras (dio ' + (A ? A.nCompras : '—') + ')');
const F = de('Roter');
chk(!F || F.nCompras === 0, 'El pedido "no entregado" no cuenta como compra');

L.push('<h2>2 · Ritmo de compra</h2>');
chk(A && A.ritmo === 9, 'Don José: ritmo de 9 días (dio ' + (A ? A.ritmo : '—') + ')');
chk(A && A.diasDesde === 26, 'Don José: última compra hace 26 días (dio ' + (A ? A.diasDesde : '—') + ')');
const B = de('Cuñados');
chk(B && B.ritmo === 7, 'Granja 2 Cuñados: ritmo de 7 días (dio ' + (B ? B.ritmo : '—') + ')');

L.push('<h2>3 · Productos habituales</h2>');
chk(A && A.habituales.length === 2, 'Don José: 2 productos habituales (dio ' + (A ? A.habituales.map((x) => x.nombre).join(', ') : '—') + ')');

L.push('<h2>4 · Sugerencias detectadas</h2>');
chk(!!sugDe('Don Jos', 'dormido'), 'Don José aparece como CLIENTE DORMIDO');
chk(!!sugDe('Cuñados', 'toca'), 'Granja 2 Cuñados aparece como LE TOCA PEDIDO');
chk(!!sugDe('Estrella', 'sin_segunda'), 'La Estrella aparece como COMPRÓ UNA SOLA VEZ');
chk(!!sugDe('Rosa', 'dejo'), 'Almacén Rosa aparece como DEJÓ DE LLEVAR');
chk(!!sugDe('Rosa', 'bajo'), 'Almacén Rosa aparece como BAJÓ EL VOLUMEN');
chk(!sugDe('Fiambrer'), 'Fiambrería El Rey NO aparece (ya tiene un pedido en curso)');

L.push('<h2>4b · Unificar por teléfono, dirección o nombre</h2>');
const pan = fichas.filter((f) => GDO.CRM.norm(f.nombre).indexOf('cayetano') >= 0);
chk(pan.length === 1, 'Panadería San Cayetano: UNA sola ficha aunque 2 pedidos no traían teléfono (dio ' + pan.length + ')');
chk(pan[0] && pan[0].nCompras === 3, 'Junta los 3 pedidos: con teléfono, sin teléfono y con la dirección abreviada (dio ' + (pan[0] ? pan[0].nCompras : '—') + ')');
chk(pan[0] && pan[0].alias.length === 3, 'La ficha guarda las 3 formas en que se escribió el nombre (dio ' + (pan[0] ? pan[0].alias.length : '—') + ')');
const marcela = fichas.filter((f) => f.nombre.indexOf('Marcela') >= 0)[0];
chk(!!marcela && marcela.nCompras === 1, 'El vecino de la MISMA dirección con OTRO teléfono queda aparte (no se mezcla)');
chk(GDO.CRM.dirKey('Av. Pres. Juan D. Perón 6871, Villa Udaondo, Ituzaingó') === GDO.CRM.dirKey('Pres Juan Peron 6871'), 'La dirección se compara sin "Av.", sin iniciales sueltas y sin localidad');
chk(GDO.CRM.dirKey('Calle 13, Hurlingham') === '', 'Una dirección sin nombre de calle real no sirve para unificar');
chk(GDO.CRM.nomKey('Consumidor Final') === '', 'Nombres genéricos ("Consumidor Final") no unifican a nadie');

L.push('<h2>4c · Unir a mano dos fichas</h2>');
const pc = fichas.filter((f) => GDO.CRM.norm(f.nombre).indexOf('centro') >= 0);
chk(pc.length === 2, 'El cliente que se mudó Y cambió de número queda en 2 fichas: la app no puede saberlo sola (dio ' + pc.length + ')');
var DOCS = [], seq = 0;
GDO.Store.crmClientes = function () { return DOCS; };
GDO.Store.upsertCrmCliente = function (c) {
  var ex = c.id ? DOCS.filter(function (x) { return x.id === c.id; })[0] : null;
  if (ex) { Object.assign(ex, c); return ex; }
  c.id = c.id || ('cli_' + (++seq)); DOCS.push(c); return c;
};
GDO.Store.deleteCrmCliente = function (id) { DOCS = DOCS.filter(function (x) { return x.id !== id; }); };
if (pc.length === 2) GDO.CRM.unir(pc[0], pc[1]);
const pc2 = GDO.CRM.fichas().filter((f) => GDO.CRM.norm(f.nombre).indexOf('centro') >= 0);
chk(pc2.length === 1, 'Después de unir a mano: una sola ficha (dio ' + pc2.length + ')');
chk(pc2[0] && pc2[0].nCompras === 2, 'La ficha unida junta los 2 pedidos, con teléfonos y direcciones distintos (dio ' + (pc2[0] ? pc2[0].nCompras : '—') + ')');
chk(pc2[0] && pc2[0].telefonos.length === 2, 'Guarda los 2 teléfonos del cliente (dio ' + (pc2[0] ? pc2[0].telefonos.length : '—') + ')');
chk(DOCS.length === 1, 'La unión deja UN solo documento guardado, no dos (dio ' + DOCS.length + ')');

L.push('<h2>4d · Pedidos sin fecha (los viejos)</h2>');
// Pedido cargado a mano, sin fecha de entrega, nunca despachado: la app no sabe cuándo fue.
const viejo = { id: 'p_viejo', cliente: 'Verdulería Los Pinos', telefono: '11 5555-9500',
  direccion: 'Roca 900, Morón', estado: 'pendiente', items: [{ producto: 'Pollo entero', cantidad: 4 }],
  historia: [], fechaEntrega: '' };
PEDIDOS.push(viejo);
chk(GDO.CRM.fechaDe(viejo) === null, 'Un pedido viejo sin fecha de entrega ni entrega registrada no tiene fecha');
chk(GDO.CRM.sinFecha().length === 1, 'La app los detecta y los puede listar para completarlos (dio ' + GDO.CRM.sinFecha().length + ')');
const fv = GDO.CRM.fichas().filter((f) => f.nombre.indexOf('Los Pinos') >= 0)[0];
chk(!!fv, 'El cliente igual aparece en la lista de clientes (no se pierde)');
chk(fv && fv.nCompras === 0, 'Pero no cuenta como compra: sin fecha no hay ritmo posible (dio ' + (fv ? fv.nCompras : '—') + ')');
// Con fecha de alta (pedidos nuevos, desde ago-2026) sí se ubica en el tiempo.
viejo.creado = hoy - 5 * DIA;
chk(GDO.CRM.fechaDe(viejo) === viejo.creado, 'Los pedidos nuevos guardan fecha de alta y ya no quedan sin fecha');
chk(GDO.CRM.sinFecha().length === 0, 'Con la fecha de alta, no queda ningún pedido huérfano');
PEDIDOS.pop();

L.push('<h2>5 · Agrupación: una tarjeta por cliente</h2>');
const ids = sugs.map((s) => s.clienteId);
chk(ids.length === new Set(ids).size, 'Ningún cliente aparece dos veces en la agenda (' + sugs.length + ' tarjetas para ' + todas.length + ' avisos)');
const rosa = sugs.filter((s) => s.ficha.nombre.indexOf('Rosa') >= 0)[0];
chk(rosa && rosa.otras.length === 2, 'Almacén Rosa: 1 tarjeta con 2 motivos extra (dio ' + (rosa ? rosa.otras.length : '—') + ')');

L.push('<h2>6 · Orden por urgencia</h2>');
L.push('<pre>' + sugs.map((s, i) => (i + 1) + '. [' + s.prio + '] ' + s.ic + ' ' + s.ficha.nombre + ' — ' + s.titulo
  + '\n     ' + s.motivo
  + (s.otras.length ? '\n     También: ' + s.otras.map((o) => o.titulo).join(' · ') : '')
  + (s.oferta ? '\n     Ofrecele: ' + s.oferta : '')).join('\n') + '</pre>');

L.push('<h2>7 · Mensajes de WhatsApp generados</h2>');
['dormido', 'toca', 'sin_segunda', 'dejo'].forEach((t) => {
  const s = todas.filter((x) => x.tipo === t)[0];
  if (s) L.push('<b>' + t + ' → ' + s.ficha.nombre + '</b><pre>' + s.msg + '</pre>');
});
chk(!todas.some((s) => /\$/.test(s.msg)), 'Ningún mensaje inventa un precio (regla GDO)');
chk(todas.every((s) => !/Hola (Kiosco|Granja|Carnicería|Almacén|Fiambrería|San|Panadería|Pollería|Depto)!/.test(s.msg)), 'El saludo usa el nombre completo del comercio, no la primera palabra');
chk(todas.every((s) => s.msg.indexOf('(el de Vergara)') < 0), 'El saludo saca las aclaraciones entre paréntesis del nombre');
const idsF = fichas.map((f) => f.id);
chk(idsF.length === new Set(idsF).size, 'Cada ficha tiene un identificador único (dos vecinos de la misma dirección no se pisan)');

document.getElementById('out').innerHTML = L.join('');
</script>
</body></html>
